<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyunlar</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;background:#160b3a;
    background-image:radial-gradient(circle at 12% 18%,#ff2e93 0,transparent 38%),radial-gradient(circle at 88% 12%,#00d4ff 0,transparent 36%),radial-gradient(circle at 80% 90%,#ffb300 0,transparent 34%),radial-gradient(circle at 10% 88%,#7c3aed 0,transparent 40%);
    background-attachment:fixed;padding:calc(24px + env(safe-area-inset-top)) 16px 40px}
  main{max-width:520px;margin:0 auto}
  h1{text-align:center;font-size:clamp(32px,9vw,48px);margin:0 0 22px;font-weight:900;
    background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff75e,#7dffb0,#5ee7ff,#a78bfa,#ff7be5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  a.card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;color:#fff;text-decoration:none;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.12s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .ic{width:56px;height:56px;border-radius:14px;flex:none}
  b{display:block;font-size:20px}
  small{opacity:.85}
</style>
</head>
<body>
<main>
  <h1>OYUNLAR</h1>
  <div class="grid">
    <a class="card" href="sudoku/">
      <img class="ic" src="sudoku/icons/icon-192.png" alt="">
      <span><b>Sudoku</b><small>Kolay · Orta · Zor</small></span>
    </a>
    <!-- Yeni oyun eklemek için yukarıdaki <a class="card"> bloğunu kopyala -->
  </div>
</main>
</body>
</html>
